$kind: http-request
description: ""
url: "{{baseUrl}}/status/"
method: GET
headers:
  Accept: application/json
settings: {}
examples: ./.resources/Comprobar disponibilidad de la API.resources/examples
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('publica una versión identificable', () => {
        const body = pm.response.json();
        pm.expect(body.status).to.eql('ok');
        pm.expect(body.version).to.be.a('string').and.not.empty;
      });
