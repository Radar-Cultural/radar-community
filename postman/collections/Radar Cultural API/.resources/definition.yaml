$kind: collection
description: Contrato de lectura pública de Radar Cultural para eventos, catálogos, organizaciones y representaciones interoperables. Las operaciones de escritura permanecen fuera de la API pública.
variables:
  - key: baseUrl
    value: http://127.0.0.1:8000/api/v1
  - key: eventSlug
    value: demo-danza
scripts:
