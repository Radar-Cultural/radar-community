$kind: collection
description: Contrato inicial de lectura pública para eventos culturales publicados y sus catálogos. Las operaciones de escritura permanecen fuera de la API pública mientras se define el flujo de identidad, revisión y moderación.
variables:
  baseUrl: https://radarcultural.mx/api/v1
scripts:
  - type: http:afterResponse
    language: text/javascript
    code: |-
      pm.test('responde HTTP 200', () => pm.response.to.have.status(200));
      pm.test('responde JSON', () => {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
