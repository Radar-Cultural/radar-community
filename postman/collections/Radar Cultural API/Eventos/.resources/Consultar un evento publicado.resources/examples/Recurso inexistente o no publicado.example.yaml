$kind: http-example
request:
  url: "{{baseUrl}}/events/:slug/"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: slug
      value: string
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": "string"
      }
order: 2000
