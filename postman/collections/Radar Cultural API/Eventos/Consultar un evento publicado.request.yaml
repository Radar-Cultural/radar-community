$kind: http-request
description: ''
url: '{{baseUrl}}/events/{{eventSlug}}/'
method: GET
headers:
  Accept: application/json
settings: {}
examples: ./.resources/Consultar un evento publicado.resources/examples
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('devuelve el evento publicado solicitado', () => {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
        pm.expect(pm.response.json().slug).to.eql(pm.variables.get('eventSlug'));
      });
      pm.test('no conserva publicaciones retiradas en caché', () => {
        pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store');
      });
