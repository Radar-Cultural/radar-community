$kind: http-request
description: Representación semántica derivada del mismo evento público.
url: '{{baseUrl}}/events/{{eventSlug}}/schema/'
method: GET
headers:
  - key: Accept
    value: application/ld+json
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde JSON-LD Schema.org', () => {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/ld+json');
        const body = pm.response.json();
        pm.expect(body['@context']).to.eql('https://schema.org');
        pm.expect(body['@type']).to.eql('Event');
      });
      pm.test('no conserva publicaciones retiradas en caché', () => {
        pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store');
      });
