<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08090d" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta
      name="description"
      content="Explora eventos culturales publicados con fuente verificable en Radar Cultural."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Radar Cultural" />
    <meta property="og:title" content="Agenda cultural | Radar Cultural" />
    <meta
      property="og:description"
      content="Explora eventos culturales publicados con fuente verificable en Radar Cultural."
    />
    <meta property="og:url" content="https://radarcultural.mx/agenda/" />
    <link rel="canonical" href="https://radarcultural.mx/agenda/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      ;(() => {
        try {
          const saved = localStorage.getItem('radar-theme')
          const theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (_) {}
      })()
    </script>
    <title>Agenda cultural | Radar Cultural</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
