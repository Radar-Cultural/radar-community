name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run tests when configured
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            pnpm test
          else
            echo "No test script is configured yet."
          fi

      - name: Build
        run: pnpm build

      - name: Verify build output
        run: test -f dist/index.html

  backend:
    name: Backend quality and security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-unique-characters-4x8p7q2m9v
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///ci.sqlite3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Django checks and migration drift
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run migrations and tests
        run: |
          python manage.py migrate --noinput
          python manage.py test

      - name: Production security checks
        env:
          DEBUG: "False"
          DATABASE_URL: sqlite:///ci-production.sqlite3
          DJANGO_ALLOWED_HOSTS: radarcultural.mx,www.radarcultural.mx
          DJANGO_CSRF_TRUSTED_ORIGINS: https://radarcultural.mx,https://www.radarcultural.mx
          DJANGO_SECURE_SSL_REDIRECT: "True"
        run: python manage.py check --deploy --fail-level WARNING
